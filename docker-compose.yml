services:
  # ============================================================
  # LMS: Moodle + PostgreSQL
  # ============================================================
  ai-curator-lms-db:
    image: postgres:15-alpine
    container_name: ai-curator-lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MOODLE_DB_USER:-moodle}
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?MOODLE_DB_PASSWORD is required}
      POSTGRES_DB: ${MOODLE_DB_NAME:-moodle}
    volumes:
      - ai-curator-lms-db-data:/var/lib/postgresql/data
    networks:
      - ai-curator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOODLE_DB_USER:-moodle} -d ${MOODLE_DB_NAME:-moodle}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-curator-lms-init:
    image: alpine:latest
    container_name: ai-curator-lms-init
    restart: "no"
    environment:
      MOODLE_VERSION: ${MOODLE_VERSION:-MOODLE_404_STABLE}
    volumes:
      - ai-curator-lms-data:/var/www/html
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /var/www/html/version.php ]; then
          echo "Downloading Moodle ${MOODLE_VERSION}..."
          apk add --no-cache git
          git clone --depth 1 --branch ${MOODLE_VERSION} https://github.com/moodle/moodle.git /var/www/html
          chown -R 33:33 /var/www/html
          echo "Moodle downloaded."
        else
          echo "Moodle already present, skipping download."
        fi
    networks:
      - ai-curator-network

  ai-curator-lms:
    image: moodlehq/moodle-php-apache:8.1
    container_name: ai-curator-lms
    restart: unless-stopped
    environment:
      MOODLE_DATABASE_TYPE: pgsql
      MOODLE_DATABASE_HOST: ai-curator-lms-db
      MOODLE_DATABASE_PORT: 5432
      MOODLE_DATABASE_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DATABASE_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DB_PASSWORD:?MOODLE_DB_PASSWORD is required}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?MOODLE_ADMIN_PASSWORD is required}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME:-AI Curator Demo LMS}
      MOODLE_WWWROOT: ${LMS_BASE_URL:-https://lms.example.com}
    volumes:
      - ai-curator-lms-data:/var/www/html
      - ai-curator-lms-moodledata:/var/www/moodledata
    networks:
      - ai-curator-network
      - n8n_default
    depends_on:
      ai-curator-lms-db:
        condition: service_healthy
      ai-curator-lms-init:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-curator-lms.rule=Host(`${LMS_HOST:-lms.example.com}`)"
      - "traefik.http.routers.ai-curator-lms.entrypoints=websecure"
      - "traefik.http.routers.ai-curator-lms.tls.certresolver=myresolver"
      - "traefik.http.services.ai-curator-lms.loadbalancer.server.port=80"

  # ============================================================
  # AI Curator Backend + Operational DB + Vector Store
  # ============================================================
  ai-curator-postgres:
    image: postgres:15-alpine
    container_name: ai-curator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIC_DB_USER:-ai_curator}
      POSTGRES_PASSWORD: ${AIC_DB_PASSWORD:?AIC_DB_PASSWORD is required}
      POSTGRES_DB: ${AIC_DB_NAME:-ai_curator}
    volumes:
      - ai-curator-postgres-data:/var/lib/postgresql/data
    networks:
      - ai-curator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIC_DB_USER:-ai_curator} -d ${AIC_DB_NAME:-ai_curator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-curator-chroma:
    # Pin Chroma image to a known-good version to avoid floating-tag breakages.
    # This digest corresponds to chromadb/chroma:0.5.25 (2026-05-05).
    image: chromadb/chroma:0.5.25@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: ai-curator-chroma
    restart: unless-stopped
    environment:
      - CHROMA_HOST=0.0.0.0
      - CHROMA_PORT=8000
      - ANONYMIZED_TELEMETRY=false
      - IS_PERSISTENT=true
      - PERSIST_DIRECTORY=/data
    volumes:
      # Chroma 0.5.x persists SQLite to /data. Older versions used /chroma/chroma.
      - ai-curator-chroma-data:/data
    networks:
      - ai-curator-network
    healthcheck:
      # The chromadb image no longer ships wget/curl/python. Use bash TCP probe.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai-curator-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-curator-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${AIC_DB_USER:-ai_curator}:${AIC_DB_PASSWORD}@ai-curator-postgres:5432/${AIC_DB_NAME:-ai_curator}}
    volumes:
      - ./storage/documents:/app/storage/documents
      - ./kb-content:/app/kb-content
    networks:
      - ai-curator-network
      - n8n_default
    depends_on:
      ai-curator-postgres:
        condition: service_healthy
      ai-curator-chroma:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-curator-backend.rule=Host(`${BACKEND_HOST:-ai-curator-api.example.com}`)"
      - "traefik.http.routers.ai-curator-backend.entrypoints=websecure"
      - "traefik.http.routers.ai-curator-backend.tls.certresolver=myresolver"
      - "traefik.http.services.ai-curator-backend.loadbalancer.server.port=8000"

  ai-curator-web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${BACKEND_API_URL:-https://ai-curator-api.example.com}
    container_name: ai-curator-web-ui
    restart: unless-stopped
    networks:
      - ai-curator-network
      - n8n_default
    depends_on:
      - ai-curator-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-curator-web-ui.rule=Host(`${WEB_UI_HOST:-ai-curator.example.com}`)"
      - "traefik.http.routers.ai-curator-web-ui.entrypoints=websecure"
      - "traefik.http.routers.ai-curator-web-ui.tls.certresolver=myresolver"
      - "traefik.http.services.ai-curator-web-ui.loadbalancer.server.port=80"

  ai-curator-admin-console:
    build:
      context: ./admin-console
      dockerfile: Dockerfile
      args:
        - VITE_ADMIN_DEMO_TOKEN=${ADMIN_CONSOLE_DEMO_TOKEN}
        - VITE_API_BASE_URL=${BACKEND_API_URL:-https://ai-curator-api.example.com}
    container_name: ai-curator-admin-console
    restart: unless-stopped
    networks:
      - ai-curator-network
      - n8n_default
    depends_on:
      - ai-curator-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-curator-admin-console.rule=Host(`${ADMIN_CONSOLE_HOST:-ai-curator-admin.example.com}`)"
      - "traefik.http.routers.ai-curator-admin-console.entrypoints=websecure"
      - "traefik.http.routers.ai-curator-admin-console.tls.certresolver=myresolver"
      - "traefik.http.services.ai-curator-admin-console.loadbalancer.server.port=80"

volumes:
  ai-curator-lms-db-data:
  ai-curator-lms-data:
  ai-curator-lms-moodledata:
  ai-curator-postgres-data:
  ai-curator-chroma-data:

networks:
  ai-curator-network:
    driver: bridge
  n8n_default:
    external: true
